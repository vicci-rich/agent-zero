# CEO seat: strategy, architecture, hardest decisions. Smartest open model
# (AA v4.1 = 51, first open-weight ever to lead the index) with the same ~1M
# ctx as minimax-m3 but +7 intelligence - so it owns this seat and the router
# owns the hot loop. Verbose (~43k output tokens/task, up to ~85k at max
# effort): call it and wait for the plan; never put it in the delegation loop.
model:
  chat:
    provider: ollama_cloud
    name: glm-5.2:cloud
    api_base: https://ollama.com
    ctx_length: 1000000
    limit_requests: 10
  utility:
    provider: ollama_cloud
    name: nemotron-3-super
    api_base: https://ollama.com
