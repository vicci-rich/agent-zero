# Cheapest level-1 model. Runs constantly (memory writes, tagging, routing help)
# and must never be the reason the weekly GPU-time budget runs out.
model:
  chat:
    provider: ollama_cloud
    name: gpt-oss:20b-cloud
    api_base: https://ollama.com
    ctx_length: 128000
    limit_requests: 30
  utility:
    provider: ollama_cloud
    name: gpt-oss:20b-cloud
    api_base: https://ollama.com
