# The volume tier. Level-2 GPU-time, cheap enough to run several in parallel
# without draining the weekly budget. Escalate a single hard story to
# 'principal-engineer' instead of upgrading this model.
model:
  chat:
    provider: ollama_cloud
    name: gpt-oss:120b-cloud
    api_base: https://ollama.com
    ctx_length: 128000
    limit_requests: 20
  utility:
    provider: ollama_cloud
    name: gpt-oss:20b-cloud
    api_base: https://ollama.com
