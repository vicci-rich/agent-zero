# Heavy dedicated coder for the hardest stories or whole-codebase changes.
# Alt: swap name to minimax-m3:cloud when you need the full ~1M context to load an
# entire codebase or when multimodal (image/video) input matters.
model:
  chat:
    provider: ollama_cloud
    name: qwen3-coder:480b-cloud
    api_base: https://ollama.com
    ctx_length: 256000
    limit_requests: 8
  utility:
    provider: ollama_cloud
    name: gpt-oss:120b-cloud
    api_base: https://ollama.com
