# The ToT router (agent 0). It fires on every hop, so it needs the best
# intelligence-per-active-param on the roster, not the biggest brain:
# minimax-m3 = 9.8B active (cheapest frontier activation), independently
# measured AA 44, ~1M ctx to hold whole-company state, native multimodal
# (can route screenshots/diagrams). Dominates deepseek-v4-flash (13B active,
# no third-party score) on every measured axis.
model:
  chat:
    provider: ollama_cloud
    name: minimax-m3
    api_base: https://ollama.com
    ctx_length: 512000         # RULER: only ~50-65% of advertised 1M is reliably usable
    limit_requests: 30         # backpressure for the 10-slot queue, not budget
  utility:
    provider: ollama_cloud
    name: nemotron-3-super
    api_base: https://ollama.com
