# Deepest world knowledge on the roster, 1M ctx. Its verbosity costs wall-clock,
# not money - fine for async research. But ~94% "answer-anyway" hallucination
# rate on AA-Omniscience means it must NEVER be the final arbiter of facts:
# QA verifies, sources get pinned.
model:
  chat:
    provider: ollama_cloud
    name: deepseek-v4-pro
    api_base: https://ollama.com
    ctx_length: 1000000
    limit_requests: 8
  utility:
    provider: ollama_cloud
    name: nemotron-3-super
    api_base: https://ollama.com
