# Deepest world knowledge on the roster - but ~94% "answer-anyway" hallucination
# rate on AA-Omniscience, so it must NEVER be the final arbiter of facts. Its
# outputs are always verified by QA / pinned to sources. Level-4 GPU-time: rationed.
# Prefer swapping to nemotron-3-ultra if you need higher factual reliability.
model:
  chat:
    provider: ollama_cloud
    name: deepseek-v4-pro
    api_base: https://ollama.com
    ctx_length: 1000000
    limit_requests: 5
  utility:
    provider: ollama_cloud
    name: gpt-oss:20b-cloud
    api_base: https://ollama.com
